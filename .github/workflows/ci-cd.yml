name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BACKEND_IMAGE: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/lf-backend

jobs:
  # ==========================================
  # Job 1: CI — Lint & Test (all pushes/PRs)
  # ==========================================
  ci:
    name: CI — Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # ---- Backend ----
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend — Type check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Backend — Lint
        working-directory: backend
        run: npm run lint

      - name: Backend — Test
        working-directory: backend
        run: npm run test

      # ---- Frontend ----
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend — Lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend — Test
        working-directory: frontend
        run: npm run test

  # ==========================================
  # Job 2: Build & Push (main branch only)
  # ==========================================
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io
          username: ${{ secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Build backend Docker image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            -t ${{ env.BACKEND_IMAGE }}:latest \
            ./backend

      - name: Push backend Docker image
        run: |
          docker push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.BACKEND_IMAGE }}:latest

  # ==========================================
  # Job 3: Deploy to Azure Web App (main only)
  # ==========================================
  deploy:
    name: Deploy to Azure Web App
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: '${{ secrets.AZURE_ACR_NAME }}.azurecr.io/lf-backend:latest'

      - name: Show deployed URL
        run: |
          echo "✅ Backend deployed successfully to Azure!"
          echo "🔗 URL: https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net"
